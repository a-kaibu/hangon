<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>反魂麻雀</title>
    <meta name="description" content="ブラウザで遊べる4人打ちリーチ麻雀。CPU対戦・役一覧・危険牌アシスト付き。" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 80'%3E%3Crect width='60' height='80' rx='8' fill='%23fbf6ea'/%3E%3Ctext x='30' y='54' font-size='42' text-anchor='middle' fill='%23c8312b' font-weight='800'%3E中%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">反魂<span>麻雀</span></div>
        <nav class="tools">
          <button class="tool" data-act="guide" title="はじめての麻雀">遊び方</button>
          <button class="tool" data-act="yaku" title="役一覧">役一覧</button>
          <button class="tool" data-act="help" title="危険牌の見方">危険牌</button>
          <button class="tool" data-act="settings" title="設定">設定</button>
        </nav>
      </header>
      <main id="stage">
        <div class="board-wrap"><div id="board" class="board"></div></div>
        <section id="me" class="me">
          <div id="assist" class="assist" aria-live="polite"></div>
          <div id="hand-row" class="hand-row"></div>
          <div id="actions" class="actions"></div>
        </section>
      </main>
      <div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div>
      <div id="callouts"></div>
    </div>
    <noscript>JavaScript を有効にしてください。</noscript>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
